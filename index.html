<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TesserCAD — Web 3D/4D CAD Studio</title>
<meta name="description" content="TesserCAD is a free, open-source, browser-based CAD studio: parametric 3D solid modelling, 2D drafting, and 4D (3D + time) simulation. No install, no account, runs entirely on your machine.">
<meta name="color-scheme" content="dark light">
<meta property="og:title" content="TesserCAD — Web 3D/4D CAD Studio">
<meta property="og:description" content="Parametric 3D modelling, 2D drafting and 4D time simulation in the browser. Free and open source.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles/app.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
</head>
<body>

<div id="boot">
  <div class="boot-card">
    <svg class="boot-mark" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M32 6 56 19v26L32 58 8 45V19z"/><path d="M32 20 44 26.5v13L32 46l-12-6.5v-13z"/><path d="M32 6v14M56 19 44 26.5M56 45 44 39.5M32 58V46M8 45l12-5.5M8 19l12 7.5"/></g></svg>
    <div class="boot-name">TesserCAD</div>
    <div class="boot-sub" id="bootMsg">Loading engine…</div>
  </div>
</div>

<header id="topbar">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M32 6 56 19v26L32 58 8 45V19z"/><path d="M32 20 44 26.5v13L32 46l-12-6.5v-13z"/><path d="M32 6v14M56 19 44 26.5M56 45 44 39.5M32 58V46M8 45l12-5.5M8 19l12 7.5"/></g></svg>
    <span class="brand-name">TesserCAD</span>
  </div>

  <nav class="menubar" id="menubar"></nav>

  <div class="doc-title">
    <input id="docName" value="Untitled" spellcheck="false" aria-label="Document name">
    <span class="doc-dirty" id="docDirty" title="Unsaved changes"></span>
  </div>

  <div class="workspaces" role="tablist" aria-label="Workspace">
    <button class="ws" data-ws="model" role="tab" aria-selected="true">Model</button>
    <button class="ws" data-ws="draft" role="tab" aria-selected="false">Draft</button>
    <button class="ws" data-ws="sim" role="tab" aria-selected="false">Simulate</button>
  </div>

  <div class="top-actions">
    <button class="icon-btn" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button class="icon-btn" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
    <button class="icon-btn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">◐</button>
    <button class="icon-btn" id="btnHelp" title="Help &amp; shortcuts (F1)" aria-label="Help">?</button>
  </div>
</header>

<div id="toolbar"></div>

<main id="workarea">
  <aside id="leftpanel" class="panel">
    <div class="panel-head">
      <span id="leftTitle">Feature tree</span>
      <button class="mini-btn" id="btnCollapseLeft" title="Collapse panel">‹</button>
    </div>
    <div class="panel-body" id="leftBody"></div>
  </aside>

  <section id="stage">
    <div id="viewport3d"></div>
    <canvas id="viewport2d" hidden></canvas>

    <div id="viewcube" class="overlay-tl"></div>
    <div id="viewInfo" class="overlay-bl"></div>
    <div id="axisHint" class="overlay-br"></div>
    <div id="hud" class="overlay-tr"></div>
    <div id="draftHint" class="draft-hint" hidden></div>

    <button id="mobLeft" class="edge-tab left" aria-label="Show the feature tree" title="Feature tree">☰</button>
    <button id="mobRight" class="edge-tab right" aria-label="Show properties" title="Properties">⚙</button>
  </section>

  <aside id="rightpanel" class="panel">
    <div class="panel-head">
      <span id="rightTitle">Properties</span>
      <button class="mini-btn" id="btnCollapseRight" title="Collapse panel">›</button>
    </div>
    <div class="panel-body" id="rightBody"></div>
  </aside>
</main>

<section id="timeline" hidden></section>

<footer id="statusbar">
  <span id="statusMsg">Ready</span>
  <span class="sp"></span>
  <span id="statusCoords" class="mono"></span>
  <span id="statusUnits" class="mono"></span>
  <span id="statusStats" class="mono"></span>
</footer>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="paletteRoot" hidden></div>
<input type="file" id="fileInput" hidden>

<noscript>
  <div style="padding:2rem;font:16px system-ui">TesserCAD needs JavaScript enabled to run.</div>
</noscript>

<script type="module">
  import('./src/main.js').catch(err => {
    console.error(err);
    const m = document.getElementById('bootMsg');
    if (m) {
      m.textContent = 'Failed to load: ' + err.message;
      m.style.color = '#ff6b6b';
    }
  });
</script>
</body>
</html>
