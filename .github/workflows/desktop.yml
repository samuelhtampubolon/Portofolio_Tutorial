# Build the downloadable desktop application.
#
# The binary is produced here rather than committed, and that is a security
# decision before it is a tidiness one. A committed .exe is a blob nobody can
# review, cannot be traced to the source it came from, and has to be trusted on
# the word of whoever pushed it. Built here, every release artefact comes from a
# commit anyone can read, by a workflow anyone can read, on a runner nobody
# controls, with a SHA-256 published beside it.
#
# Triggered by a version tag, or by hand from the Actions tab.
name: Desktop build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The web application has no dependencies, so its own checks run first
      # and cost nothing. A desktop build of a broken app is worse than none.
      - name: Verify the application before packaging it
        run: npm test

      - name: Install the shell's build tooling
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Package
        working-directory: desktop
        run: npm run dist

      # A hash lets anyone confirm the file they downloaded is the file this
      # workflow produced. It is the only verification available without a
      # code-signing certificate, and it is worth more than a self-signed one.
      - name: Publish checksums
        shell: bash
        run: |
          cd dist-desktop
          for f in *.exe *.AppImage *.dmg; do
            [ -e "$f" ] || continue
            sha256sum "$f" | tee "$f.sha256"
          done
          echo '--- artefacts ---'
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: tessercad-${{ matrix.artifact }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.dmg
            dist-desktop/*.sha256
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.dmg
            dist-desktop/*.sha256
          fail_on_unmatched_files: false
