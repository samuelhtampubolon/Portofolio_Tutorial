# Publishes TesserCAD to GitHub Pages.
#
# There is no build step: the app is plain ES modules and the three.js runtime
# is vendored into vendor/, so the repository is uploaded as-is.
name: Deploy TesserCAD to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the geometry / CSG / DXF test suite
        run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Note: `enablement: true` is deliberately NOT set here. Creating a Pages
      # site needs repository-admin rights, which the workflow's GITHUB_TOKEN
      # never has, so it fails with an opaque "Resource not accessible by
      # integration". Without it the action gives the actionable message
      # instead: enable Pages once under Settings -> Pages.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
